<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#101820" />
  <title>Racing Simulator 3D</title>
  <link rel="stylesheet" href="./src/style.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="game">
    <div class="topbar">
      <div class="brand"><span class="brand-mark">RS</span><div><strong>RACING SIMULATOR</strong><small>PROTO // CIRCUIT TEST</small></div></div>
      <div class="top-actions"><span class="live-dot">SIMULATION ACTIVE</span><button id="cameraBtn" class="ui-button">CAMÉRA : EXT.</button><button id="resetBtn" class="ui-button">RECOMMENCER</button></div>
    </div>
    <div class="hud">
      <div class="speed-panel"><span class="hud-label">VITESSE</span><div><strong id="speed">000</strong><span>KM/H</span></div></div>
      <div class="gear-panel"><span class="hud-label">RAPPORT</span><strong id="gear">N</strong></div>
      <div class="help-panel"><strong>CONTRÔLES</strong><span> Z / ↑ ACCÉLÉRER</span><span> S / ↓ FREINER</span><span> Q D / ← → BRAQUER</span><span>C CHANGER DE CAMÉRA</span></div>
    </div>
    <div class="bottom-hint">CIRCUIT CLUB • SESSION LIBRE <span>V 0.1.0</span></div>
    <div id="loading" class="loading"><div class="loader"></div><strong>PRÉPARATION DU CIRCUIT</strong><small>Initialisation du moteur 3D…</small></div>
    <div id="error" class="error hidden"></div>
    <div class="mobile-controls">
      <div class="steering"><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button></div>
      <div class="pedals"><button data-key="ArrowDown">FREIN</button><button data-key="ArrowUp" class="accelerate">GAZ</button></div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
